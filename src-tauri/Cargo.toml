[package]
name = "gfc"
version = "0.2.6"
description = "GFC: Galactic Federation Coin"
edition = "2021"
rust-version = "1.80"

[lib]
# The _lib suffix keeps the lib and bin names apart on Windows (cargo#8519)
name = "gfc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2", features = ["multipart", "stream"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "android")'.dependencies]
keyring-core = "1"
android-native-keyring-store = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Dev builds keep line numbers for backtraces but not full debug info: much smaller Android
# debug APKs (and faster installs over adb)
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
